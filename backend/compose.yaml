services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: astrology
      POSTGRES_USER: astrology
      POSTGRES_PASSWORD: astrology-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrology -d astrology"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - astrology_postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  astrology_postgres_data:
